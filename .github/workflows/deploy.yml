# Builds the static site and publishes it to GitHub Pages on every push to main,
# and once a day so the list of sponsors stays current.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Check the user guide
        run: python3 scripts/verify-handbook.py

      - name: Fetch public sponsors
        run: python3 scripts/fetch-sponsors.py
        env:
          # Personal access token (classic) with read:user and read:org. Optional:
          # without it the Sponsor page shows its "be the first" message.
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # "/<repository>" for a project site, empty for a custom domain or <user>.github.io.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
